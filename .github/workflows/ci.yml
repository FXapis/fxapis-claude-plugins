name: ci
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
      - run: npx --yes @anthropic-ai/claude-code@latest plugin validate . --strict
      - run: npx --yes @anthropic-ai/claude-code@latest plugin validate ./plugins/fxapis --strict
